<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Beast Brawl!</title>
<meta name="description" content="Beast Brawl! : combats d'animaux en temps réel, cartes et cages à ouvrir.">
<meta name="theme-color" content="#0e1a3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon2-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beast Brawl!">
<link rel="preload" href="assets/fonts/LilitaOne.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/ui/logo_michigan2.webp" as="image">
<link rel="preload" href="assets/bg/loading.webp" as="image">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/menus.css">
<link rel="stylesheet" href="styles/battle.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<div id="backdrop"><canvas id="backdropCv"></canvas></div>
<div id="app">
  <div id="stage">
    <!-- Chargement -->
    <section id="scrLoading" class="screen">
      <div class="ld-bar"><div class="ld-fill" id="ldFill"></div></div>
      <div class="ld-text t" id="ldText">Chargement…</div>
      <div class="ld-tip t" id="ldTip"></div>
    </section>

    <!-- Ouverture : logo du studio (par-dessus le chargement, qui se prépare dessous) -->
    <section id="scrLogo" class="screen">
      <canvas id="logoCv" width="1" height="1"></canvas>
    </section>

    <!-- Menus (accueil, boutique, collection, clan, classé) -->
    <section id="scrMenu" class="screen" hidden>
      <canvas id="menuCv" width="941" height="1672"></canvas>
      <div id="slider"></div>
      <canvas id="navCap" width="1" height="1"></canvas>
      <div id="pageFixed"></div>
      <div id="topbar">
        <div class="tb-lvl t" id="tbLvl">1</div>
        <div class="tb-xp"><div class="tb-xpfill" id="tbXpFill"></div></div>
        <div class="tb-xptxt t" id="tbXp">0 / 100</div>
        <div class="tb-val t" id="tbCoins" style="left:442px">0</div>
        <div class="tb-val t" id="tbPaws" style="left:676px">0</div>
        <div class="tb-val t" id="tbRubies" style="left:882px">0</div>
        <button class="hit" data-act="plus-coins" style="left:256px;top:12px;width:62px;height:58px" aria-label="Obtenir des pièces"></button>
        <button class="hit" data-act="plus-paws" style="left:504px;top:12px;width:62px;height:58px" aria-label="Obtenir des pattes"></button>
        <button class="hit" data-act="plus-rubies" style="left:722px;top:12px;width:62px;height:58px" aria-label="Obtenir des gemmes"></button>
      </div>
      <nav id="nav"></nav>
    </section>

    <!-- Combat -->
    <section id="scrBattle" class="screen" hidden>
      <canvas id="cv" width="941" height="1672"></canvas>
      <div id="bHud"></div>
    </section>

    <div id="fly"></div>
    <div id="modals"></div>
    <div id="toasts"></div>
  </div>
</div>
<script>
// Mise à l'échelle de la scène dès le premier affichage, avant l'arrivée du code du jeu : sans elle, l'écran de
// lancement apparaît d'abord en taille réelle (941 × 1672, un gros zoom sur un téléphone) puis rétrécit d'un coup.
(function () {
  var W = 941, H = 1672, vw = innerWidth, vh = innerHeight, s = Math.min(vw / W, vh / H);
  document.getElementById('stage').style.transform = 'translate(' + Math.round((vw - W * s) / 2) + 'px,' + Math.round((vh - H * s) / 2) + 'px) scale(' + s + ')';
  if (!/[?&]test(=|&|$)/.test(location.search)) document.documentElement.classList.add('intro');
})();
</script>
</body>
</html>
